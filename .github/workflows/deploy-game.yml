name: deploy-game
on:
  push:
    branches: [main]
    paths:
      - experiments/monorepo/game/**
      - .github/workflows/deploy-game.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/monorepo/game
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # 주소에 저장소 이름이 붙어도 파일을 찾도록 상대 경로로 빌드한다
      - run: pnpm build --base=./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: experiments/monorepo/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
